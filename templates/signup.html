{% extends "base.html" %}
{% block title %}{{ t.signup_title }} — {{ t.app_name }}{% endblock %}
{% block content %}

<div class="auth-layout">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="auth-logo">🗳️</div>
      <h1>{{ t.signup_title }}</h1>
      <p>Join VoteIQ to track your voting readiness</p>
    </div>

    <div id="authError" class="error-banner" style="display:none"></div>

    <form id="signupForm" onsubmit="submitSignup(event)">
      <div class="form-group">
        <label class="form-label">{{ t.username }}</label>
        <input type="text" id="signupUsername" name="username" class="form-input" placeholder="Choose a username (3+ chars)" required minlength="3" autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label">{{ t.password }}</label>
        <div class="input-with-toggle">
          <input type="password" id="signupPassword" name="password" class="form-input" placeholder="Choose a password (6+ chars)" required minlength="6" autocomplete="new-password" />
          <button type="button" class="toggle-pw" onclick="togglePassword('signupPassword')">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">{{ t.country }} (optional)</label>
        <input type="text" id="signupCountry" name="country" class="form-input" placeholder="e.g. india, usa, uk" />
      </div>

      <div class="form-group">
        <label class="form-label">Preferred Language</label>
        <select id="signupLanguage" class="select-input">
          <option value="en">English</option>
          <option value="hi">हिंदी (Hindi)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="signupBtn">
        {{ t.signup_btn }}
      </button>
    </form>

    <div class="auth-divider">or</div>

    <p class="auth-switch">Already have an account? <a href="/login">{{ t.nav_login }}</a></p>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
async function submitSignup(e) {
  e.preventDefault();
  const username = document.getElementById('signupUsername').value.trim();
  const password = document.getElementById('signupPassword').value;
  const country = document.getElementById('signupCountry').value.trim().toLowerCase().replace(' ', '_');
  const language = document.getElementById('signupLanguage').value;
  const btn = document.getElementById('signupBtn');

  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const r = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, country, language }),
      credentials: 'include'
    });
    const data = await r.json();

    if (data.success) {
      window.location.href = '/dashboard';
    } else {
      showAuthError(data.error || 'Signup failed');
    }
  } catch(e) {
    showAuthError('Network error. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = '{{ t.signup_btn }}';
  }
}

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
}

function togglePassword(id) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
